name: cursor2api

# Pull-only deployment. This file intentionally has no build sections, so a
# server can deploy cursor2api with Docker alone and without cloning the repo.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cursor2api}
      POSTGRES_USER: ${POSTGRES_USER:-cursor2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  bridge:
    image: docker.io/${CURSOR2API_IMAGE_NAMESPACE:-nglsg}/cursor2api-bridge:${CURSOR2API_IMAGE_TAG:-latest}
    environment:
      CURSOR_SDK_BRIDGE_HOST: 0.0.0.0
      CURSOR_SDK_BRIDGE_PORT: 8792
      CURSOR_SDK_BRIDGE_TOKEN: ${CURSOR_SDK_BRIDGE_TOKEN:?Set CURSOR_SDK_BRIDGE_TOKEN before starting Compose}
      CURSOR_SDK_BRIDGE_RUN_TIMEOUT_MS: ${CURSOR_SDK_BRIDGE_RUN_TIMEOUT_MS:-180000}
    expose:
      - "8792"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8792/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  api:
    image: docker.io/${CURSOR2API_IMAGE_NAMESPACE:-nglsg}/cursor2api-api:${CURSOR2API_IMAGE_TAG:-latest}
    depends_on:
      bridge:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 6718
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_API_KEYS: ${CURSOR_API_KEYS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting Compose}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CURSOR_CLIENT_VERSION: ${CURSOR_CLIENT_VERSION:-2.6.22}
      CURSOR_SDK_BRIDGE_URL: http://bridge:8792/sdk
      CURSOR_SDK_BRIDGE_TOKEN: ${CURSOR_SDK_BRIDGE_TOKEN:?Set CURSOR_SDK_BRIDGE_TOKEN before starting Compose}
      CURSOR_SDK_BRIDGE_RUN_TIMEOUT_MS: ${CURSOR_SDK_BRIDGE_RUN_TIMEOUT_MS:-180000}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-cursor2api}
      PGUSER: ${POSTGRES_USER:-cursor2api}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PREFIX: ${REDIS_PREFIX:-cursor2api:}
      CURSOR_ACCOUNT_STICKY_TTL_SECONDS: ${CURSOR_ACCOUNT_STICKY_TTL_SECONDS:-7200}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY before starting Compose}
    volumes:
      # Retained read-only for explicit legacy import; no runtime file state.
      - router-data:/var/lib/api-for-cursor:ro
    ports:
      - "${API_PORT:-6718}:6718"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:6718/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped

volumes:
  router-data:
  postgres-data:
  redis-data:
